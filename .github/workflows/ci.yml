name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (data-dependent tests are skipped: the dataset is not in the repo)
        run: pytest -q

      - name: Score the example input with the committed model
        run: python -m src.infer --csv examples/sample_readings.csv --out sample_scored.csv
